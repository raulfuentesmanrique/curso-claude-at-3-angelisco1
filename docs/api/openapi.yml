openapi: 3.1.0
info:
  title: Resttek API
  version: 1.0.0
  description: |
    API de la plataforma de gestión de restaurantes Resttek.

    - Todas las rutas cuelgan de `/api/v1` y exigen un JWT (`Authorization: Bearer <token>`) salvo que se indique lo contrario.
    - El JSON de entrada y salida usa camelCase.
    - Los errores de dominio los devuelve el `errorHandler` con la forma `{ error, message }`, donde `error` es el nombre de la clase de error.
      Los middlewares de autenticación (`401`) y autorización (`403`) responden directamente con `{ error }` (sin `message`).
    - Los roles posibles son `admin`, `manager`, `camarero`, `cocinero` y `cliente`. Cada operación indica los roles admitidos en su descripción y en la extensión `x-roles`.
  license:
    name: Privada
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
security:
  - bearerAuth: []
tags:
  - name: Mesas
    description: |
      Mesas de un restaurante (`restaurant_tables`). Una mesa tiene un número único dentro de su restaurante,
      una capacidad (nº máximo de comensales) y un estado: `libre`, `ocupada` o `reservada`.
      El campo `tableId` de un pedido (`POST /orders`) referencia el `id` de una mesa.

paths:
  /restaurants/{restaurantId}/tables:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      summary: Listar las mesas de un restaurante
      operationId: listTables
      description: |
        Devuelve todas las mesas del restaurante ordenadas por `number` ascendente. Si el restaurante no tiene mesas
        (o no existe) devuelve un array vacío.

        **Roles:** admin, manager, camarero, cocinero.
      x-roles: [admin, manager, camarero, cocinero]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de mesas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
              example:
                - id: table-1-1
                  restaurantId: rest-1
                  number: 1
                  description: Junto a la ventana
                  capacity: 2
                  status: libre
                  createdAt: '2026-01-01T10:00:00.000Z'
                  updatedAt: '2026-01-01T10:00:00.000Z'
                - id: table-1-2
                  restaurantId: rest-1
                  number: 2
                  description: null
                  capacity: 4
                  status: ocupada
                  createdAt: '2026-01-01T10:00:00.000Z'
                  updatedAt: '2026-01-01T12:30:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Mesas]
      summary: Crear una mesa
      operationId: createTable
      description: |
        Crea una mesa en el restaurante. `number` y `capacity` deben ser enteros > 0 (de tipo número JSON, no cadena).
        `status` es opcional y por defecto vale `libre`; se normaliza con trim + minúsculas.
        El número debe ser único dentro del restaurante (`409` si se repite).

        **Roles:** admin.
      x-roles: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableDto'
            example:
              number: 5
              description: Terraza
              capacity: 6
      responses:
        '201':
          description: Mesa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: 3f0c1c4e-8a5e-4d0b-9a57-2f3c9a1b7e11
                restaurantId: rest-1
                number: 5
                description: Terraza
                capacity: 6
                status: libre
                createdAt: '2026-01-01T10:00:00.000Z'
                updatedAt: '2026-01-01T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El restaurante no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: RestaurantNotFoundError
                message: Restaurant not found
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'

  /restaurants/{restaurantId}/tables/available:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Mesas]
      summary: Listar las mesas disponibles para N personas
      operationId: listAvailableTables
      description: |
        Devuelve las mesas del restaurante en estado `libre` con `capacity >= people`, ordenadas por `capacity`
        ascendente y, a igualdad, por `number` ascendente (primero las que mejor se ajustan al grupo).
        Las mesas `reservada` u `ocupada` nunca aparecen.

        **Roles:** cliente, admin, manager, camarero, cocinero.
      x-roles: [cliente, admin, manager, camarero, cocinero]
      security:
        - bearerAuth: []
      parameters:
        - name: people
          in: query
          required: true
          description: Número de comensales. Entero > 0.
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: Mesas libres con capacidad suficiente (puede ser un array vacío).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
              example:
                - id: table-1-2
                  restaurantId: rest-1
                  number: 2
                  description: null
                  capacity: 4
                  status: libre
                  createdAt: '2026-01-01T10:00:00.000Z'
                  updatedAt: '2026-01-01T10:00:00.000Z'
        '400':
          description: '`people` falta o no es un entero > 0.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidPeopleCountError
                message: People must be a positive integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /restaurants/{restaurantId}/tables/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [Mesas]
      summary: Obtener una mesa
      operationId: getTable
      description: |
        Devuelve la mesa. Si no existe o no pertenece al `restaurantId` de la ruta devuelve `404`.

        **Roles:** admin, manager, camarero, cocinero.
      x-roles: [admin, manager, camarero, cocinero]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mesa encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
    put:
      tags: [Mesas]
      summary: Editar una mesa
      operationId: updateTable
      description: |
        Reemplaza número, descripción y capacidad de la mesa con las mismas reglas que al crearla.
        `status` es opcional: si se omite se conserva el estado actual.
        `description` omitida o `null` deja la mesa sin descripción.

        **Roles:** admin.
      x-roles: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableDto'
            example:
              number: 5
              description: Terraza cubierta
              capacity: 8
              status: reservada
      responses:
        '200':
          description: Mesa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/DuplicatedTableNumber'
    delete:
      tags: [Mesas]
      summary: Borrar una mesa
      operationId: deleteTable
      description: |
        Borra la mesa. Solo se puede borrar una mesa en estado `libre` (`409` si está `ocupada` o `reservada`).
        Los pedidos que la referencian conservan su `tableId`.

        **Roles:** admin.
      x-roles: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Mesa borrada (sin cuerpo).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/TableNotAvailable'

  /restaurants/{restaurantId}/tables/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    patch:
      tags: [Mesas]
      summary: Cambiar el estado de una mesa
      operationId: updateTableStatus
      description: |
        Fija el estado de la mesa (cualquier transición entre `libre`, `ocupada` y `reservada` está permitida).
        Es la forma de liberar una mesa. El valor se normaliza con trim + minúsculas.

        **Roles:** admin, manager, camarero, cocinero.
      x-roles: [admin, manager, camarero, cocinero]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableStatusDto'
            example:
              status: libre
      responses:
        '200':
          description: Mesa con el estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: Estado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: InvalidTableStatusError
                message: 'Invalid table status: sucia. Must be one of: libre, ocupada, reservada'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'

  /restaurants/{restaurantId}/tables/{id}/occupy:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [Mesas]
      summary: Ocupar una mesa libre
      operationId: occupyTable
      description: |
        Pasa la mesa de `libre` a `ocupada` de forma atómica (`UPDATE ... WHERE status = 'libre'`).
        Si dos clientes intentan ocupar la misma mesa a la vez, solo uno lo consigue; el otro recibe `409`.
        No lleva cuerpo.

        **Roles:** cliente.
      x-roles: [cliente]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Mesa ocupada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
              example:
                id: table-1-1
                restaurantId: rest-1
                number: 1
                description: Junto a la ventana
                capacity: 2
                status: ocupada
                createdAt: '2026-01-01T10:00:00.000Z'
                updatedAt: '2026-01-01T13:05:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableNotFound'
        '409':
          $ref: '#/components/responses/TableNotAvailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenido en `POST /auth/login` o `POST /auth/register`.

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Id del restaurante.
      schema:
        type: string
      example: rest-1
    TableId:
      name: id
      in: path
      required: true
      description: Id de la mesa.
      schema:
        type: string
      example: table-1-1

  schemas:
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
      description: Estado de la mesa.
      example: libre

    Table:
      type: object
      required: [id, restaurantId, number, description, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Id de la mesa (UUID al crearla por API; ids fijos en el seed).
          example: table-1-1
        restaurantId:
          type: string
          example: rest-1
        number:
          type: integer
          minimum: 1
          description: Número visible de la mesa, único dentro del restaurante.
          example: 1
        description:
          type: [string, 'null']
          description: Descripción libre (ubicación, notas). `null` si no tiene.
          example: Junto a la ventana
        capacity:
          type: integer
          minimum: 1
          description: Número máximo de comensales.
          example: 2
        status:
          $ref: '#/components/schemas/TableStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-01-01T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-01T10:00:00.000Z'

    CreateTableDto:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          description: Entero > 0, único en el restaurante.
          example: 5
        description:
          type: [string, 'null']
          description: Opcional. Una cadena vacía o solo espacios se guarda como `null`.
          example: Terraza
        capacity:
          type: integer
          minimum: 1
          description: Entero > 0.
          example: 6
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional; por defecto `libre`.

    UpdateTableDto:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          example: 5
        description:
          type: [string, 'null']
          description: Omitida, `null` o vacía → sin descripción.
          example: Terraza cubierta
        capacity:
          type: integer
          minimum: 1
          example: 8
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional; si se omite se conserva el estado actual.

    UpdateTableStatusDto:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TableStatus'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Nombre del error de dominio (p. ej. `TableNotFoundError`) o texto del middleware de auth.
          example: TableNotFoundError
        message:
          type: string
          description: Mensaje legible. Ausente en las respuestas `401`/`403` de los middlewares.
          example: Table not found

  responses:
    ValidationError:
      description: |
        Datos inválidos. Posibles `error`: `InvalidTableNumberError` (número no entero > 0),
        `InvalidTableCapacityError` (capacidad no entera > 0), `InvalidTableStatusError` (estado fuera de
        `libre`, `ocupada`, `reservada`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InvalidTableCapacityError
            message: Capacity must be a positive integer
    Unauthorized:
      description: Falta el token o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Unauthorized: No token provided'
    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'Forbidden: Insufficient permissions'
    TableNotFound:
      description: La mesa no existe o no pertenece al restaurante de la ruta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TableNotFoundError
            message: Table not found
    DuplicatedTableNumber:
      description: Ya existe otra mesa con ese número en el restaurante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DuplicatedTableNumberError
            message: Table number already exists in this restaurant
    TableNotAvailable:
      description: La mesa no está `libre` (ya ocupada o reservada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TableNotAvailableError
            message: Table is not available
